const BG={cv:null,ctx:null,mode:'aurora',blobs:[],motes:[],cols:[],rgb:[194,162,100],rgb2:[78,158,119],reduced:false};
function cssRGB(varName){
  try{
    const v=getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    if(v.startsWith('#')){let h=v.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');
      return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  }catch(e){}
  return [194,162,100];
}
function bgfxInit(){
  BG.cv=document.getElementById('bgfx');

  try{BG.ctx=BG.cv.getContext('2d');}catch(e){BG.ctx=null;}
  if(!BG.ctx)return;
  try{BG.reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}

  requestAnimationFrame(bgfxLoop);
}
function bgfxSize(){
  if(!BG.cv)return;
  /* render budget: never more than ~1.6MP regardless of monitor/DPR — atmosphere is soft, upscaling is invisible */
  const d0=Math.min(window.devicePixelRatio||1,2);
  const px=innerWidth*d0*innerHeight*d0;
  const scale=Math.min(1,Math.sqrt(1600000/px));
  const d=d0*scale;
  BG.cv.width=Math.round(innerWidth*d);BG.cv.height=Math.round(innerHeight*d);
  BG.cv.style.width=innerWidth+'px';BG.cv.style.height=innerHeight+'px';
  if(BG.ctx)BG.ctx.setTransform(d,0,0,d,0,0);
}
function bgfxSet(theme){
  BG.mode=({phosphor:'rain',violet:'nebula',neon:'grid',ember:'embers',arctic:'borealis',monolith:'grain',sakura:'petals'})[theme]||'aurora';
  BG.rgb=cssRGB('--accent');BG.rgb2=cssRGB('--pos');BG.rgb3=cssRGB('--info');
  bgfxSeed();
}
function bgfxSeed(){
  const W=innerWidth,H=innerHeight,R=Math.random;
  BG.blobs=[...Array(5)].map((_,i)=>({
    x:R()*W,y:R()*H,r:220+R()*320,
    dx:(R()-.5)*.22,dy:(R()-.5)*.16,
    a:.05+R()*.05, alt:i%2===1
  }));
  BG.motes=[...Array(46)].map(()=>({x:R()*W,y:R()*H,s:.5+R()*1.6,v:.12+R()*.3,a:.06+R()*.14,tw:R()*6.28}));
  const colW=18;
  BG.cols=[...Array(Math.ceil(W/colW))].map((_,i)=>({x:i*colW,y:R()*H,v:.4+R()*1.4,ch:[]}));
  BG.embers=[...Array(70)].map(()=>({x:R()*W,y:H+R()*H,s:1+R()*2.4,v:.25+R()*.7,w:R()*6.28,a:.25+R()*.5,life:R()}));
  BG.petals=[...Array(34)].map(()=>({x:R()*W,y:-R()*H,s:5+R()*7,v:.35+R()*.6,rot:R()*6.28,rv:(R()-.5)*.03,sw:R()*6.28,a:.35+R()*.35}));
  BG.ribbons=[...Array(4)].map((_,i)=>({y:H*(.15+i*.18),amp:30+R()*40,ph:R()*6.28,sp:.0006+R()*.0006,a:.05+R()*.05,alt:i%2}));
  BG.grainT=0;
}
const GLYPHS='01アイウエオカキク09ΛΞΦΨΣ<>/{}=+*#';
let BG_LAST=0;
function bgfxLoop(t){
  if(window.innerWidth<=760){requestAnimationFrame(bgfxLoop);return;}
  if(t-BG_LAST<32){requestAnimationFrame(bgfxLoop);return;}BG_LAST=t;
  requestAnimationFrame(bgfxLoop);
  if(!BG.ctx)return;
  const c=BG.ctx,W=innerWidth,H=innerHeight;
  if(document.hidden)return;
  c.clearRect(0,0,W,H);
  if(!S.fx)return;
  const [r,g,b]=BG.rgb,[r2,g2,b2]=BG.rgb2;
  if(BG.mode==='rain'&&!BG.reduced){
    c.font='12px "IBM Plex Mono",monospace';
    for(const col of BG.cols){
      col.y+=col.v;
      if(col.y>H+60){col.y=-Math.random()*300;col.v=.4+Math.random()*1.4;}
      for(let k=0;k<5;k++){
        const yy=col.y-k*15;if(yy<0||yy>H)continue;

  }
  if(BG.mode==='grid'){

    const off=BG.reduced?0:((t/40)%40);

    c.globalAlpha=1;

    c.strokeStyle=`rgba(${r},${g},${b},.35)`;c.beginPath();c.moveTo(0,hz);c.lineTo(W,hz);c.stroke();
    if(!BG.reduced){const sy=(t/9)%(H+80)-40;const sg=c.createLinearGradient(0,sy-30,0,sy+30);sg.addColorStop(0,'rgba(0,0,0,0)');sg.addColorStop(.5,`rgba(${r2},${g2},${b2},.06)`);sg.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=sg;c.fillRect(0,sy-30,W,60);}

      const a=e.a*(1-e.life)*(0.7+0.3*Math.sin(e.w*3));

      gr.addColorStop(0,`rgba(${r},${g},${b},${a.toFixed(3)})`);gr.addColorStop(1,'rgba(0,0,0,0)');

  for(const m of BG.motes){
    if(!BG.reduced){
      m.y-=m.v;m.tw+=.03;
      if(m.y<-4){m.y=H+4;m.x=Math.random()*W;}
    }
    const a=BG.mode==='nebula'?m.a*(0.6+0.4*Math.sin(m.tw)):m.a;
    c.fillStyle=`rgba(${r},${g},${b},${a.toFixed(3)})`;
    c.fillRect(m.x,m.y,m.s,m.s);
  }
}

function hexRGB(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}

   ============================================================ */
function fileToDataURL(file,maxW,maxH,cb){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(maxW/img.width,maxH/img.height,1);
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',.85));
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
$('#avatar-file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  fileToDataURL(f,220,220,url=>{
    S.profile.avatar=url;save();paintAvatar();pushMedia();
    if(VIEW==='profile')RENDER.profile();
    if(VIEW==='overview')RENDER.overview();
    toast('Avatar set');
  });
  e.target.value='';
});
$('#deco-file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      /* normalise to 512x512 PNG (transparency kept) */
      const cv=document.createElement('canvas');cv.width=cv.height=512;
      const c=cv.getContext('2d');const s=Math.min(512/img.width,512/img.height);
      const w=img.width*s,h=img.height*s;c.drawImage(img,(512-w)/2,(512-h)/2,w,h);
      const url=cv.toDataURL('image/png');
      if(url.length>420000){toast('Decoration too large — export ≤ 512px with fewer colours');return;}
      const d={id:'c_'+uid(),name:(f.name||'Custom').replace(/\.[^.]+$/,'').slice(0,24),img:url,anim:'float'};
      S.customDecos=S.customDecos||[];S.customDecos.push(d);S.profile.deco=d.id;save();
      toast('Decoration added');RENDER.profile();
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
  e.target.value='';
});

/* RENDER registry is wrapped: error boundary + focus/scroll preservation + a11y upgrade of clickable divs */
const _RENDER_RAW={};
const RENDER=new Proxy(_RENDER_RAW,{
  set(t,k,fn){
    t[k]=function(){
      const ae=document.activeElement;
      const fid=ae&&ae.id;const sel=ae&&ae.selectionStart!==undefined?[ae.selectionStart,ae.selectionEnd]:null;
      const sy=window.scrollY;
      try{ fn.apply(this,arguments); }
      catch(err){
        console.error('[render:'+k+']',err);
        const host=document.getElementById('v-'+k);
        if(host)host.innerHTML=`<div class="card"><div class="card-head"><div class="eyebrow">${I('zap')}This view hit an error</div></div>
          <div class="sub" style="font-size:12px;color:var(--muted);margin-bottom:12px">${esc(String(err&&err.message||err))}</div>
          <div style="display:flex;gap:8px"><button class="btn primary sm" onclick="RENDER['${k}']()">Retry</button><button class="btn sm" onclick="location.reload()">Reload app</button></div>
          <div class="sub" style="font-size:11px;color:var(--faint);margin-top:10px">Your data is safe — this is a display error, not a data error.</div></div>`;
      }
      a11yPass();
      if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement){try{el.focus({preventScroll:true});if(sel&&el.setSelectionRange)el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
      if(Math.abs(window.scrollY-sy)>2)window.scrollTo({top:sy});
      return true;
    };
    return true;
  }
});
function a11yPass(){
  document.querySelectorAll('.cal-cell,.mcal-day,.mstrip-day,.note-item,.deco-card,.theme-card,.banner-opt,.mday-item,.yt-title[onclick],.hcell').forEach(el=>{
    if(el.tagName==='BUTTON')return;
    if(!el.hasAttribute('tabindex'))el.tabIndex=0;
    if(!el.hasAttribute('role'))el.setAttribute('role','button');
  });
}
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.tagName!=='BUTTON'){
    e.preventDefault();e.target.click();
  }
});

/* shared calc */
function nextEvent(){
  const now=new Date();
  return S.events.filter(e=>new Date(e.date+'T'+(e.time||'23:59'))>=now)
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
}
function habitStreak(h){
  let s=0,d=todayISO();
  if(!h.log[d])d=addDays(d,-1);
  while(h.log[d]){s++;d=addDays(d,-1);}
  return s;
}
function weekWorkouts(){const cut=addDays(todayISO(),-6);return S.workouts.filter(w=>w.date>=cut)}
function monthNet(){const m=todayISO().slice(0,7);return S.tx.filter(t=>t.date.startsWith(m)).reduce((a,t)=>a+t.amt,0)}
function pushToday(){return S.pushups.log[todayISO()]||0}
function pushDays(n){const t=todayISO();return [...Array(n)].map((_,i)=>{const d=addDays(t,i-(n-1));return {d,v:S.pushups.log[d]||0}})}
function push7(){return pushDays(7).reduce((a,x)=>a+x.v,0)}
function bestPushDay(){return Math.max(0,...Object.values(S.pushups.log))}
function curWeight(){return S.weight.log.length?S.weight.log[S.weight.log.length-1].lbs:null}
function greetWord(){const h=new Date().getHours();return h<5?'Late shift':h<12?'Morning':h<17?'Afternoon':'Evening'}

function ovFlip(fn){
  const before={};$$('.ovblk').forEach(el=>{before[el.dataset.ov]=el.getBoundingClientRect();});
  fn();
  requestAnimationFrame(()=>{$$('.ovblk').forEach(el=>{const b=before[el.dataset.ov];if(!b)return;const a=el.getBoundingClientRect();const dx=b.left-a.left,dy=b.top-a.top;if(!dx&&!dy)return;

const CU_LAST={};
function countUp(el,key){
  if(!el||BG.reduced)return;
  const target=parseFloat((el.textContent||'').replace(/[^0-9.\-]/g,''));
  if(isNaN(target))return;
  const from=CU_LAST[key]===undefined?target*.6:CU_LAST[key];
  CU_LAST[key]=target;
  if(from===target)return;
  const raw=el.textContent;const pre=raw.match(/^[^0-9\-]*/)[0];const post=raw.match(/[^0-9]*$/)[0];
  const isMoney=raw.includes('$');const t0=performance.now(),dur=650;
  const step=now=>{const p=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-p,3);const v=from+(target-from)*e;
    el.textContent=pre+(isMoney?Math.round(v).toLocaleString('en-CA'):Math.round(v))+post;
    if(p<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

/* ============================================================
   CALENDAR
   ============================================================ */
let CAL=new Date(), CALVIEW='month';
const HOUR_H=44, DAY_START=6, DAY_END=24;

function fmtCountdown(){
  const e=nextEvent(); if(!e)return '';
  const ms=new Date(e.date+'T'+(e.time||'23:59'))-new Date();
  if(ms<0)return '';
  const m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;
  const rel=d>0?`${d}d ${h}h`:h>0?`${h}h ${mm}m`:`${mm}m`;
  return `${I('clock')}<span>${esc(e.title.length>26?e.title.slice(0,26)+'…':e.title)} · in ${rel}</span>`;
}
function lifeMarks(iso){
  return {
    f:(S.pushups.log[iso]||0)>0||S.workouts.some(w=>w.date===iso),
    g:S.golfSessions.some(s=>s.date===iso)||S.golf.rounds.some(r=>r.date===iso)
  };
}
const WS=()=>S.weekStart==='mon'?1:0;                 /* 0=Sunday-first, 1=Monday-first */
const dowIdx=d=>(d.getDay()-WS()+7)%7;                /* column index for a date */
const DOW_NAMES=()=>{const a=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return WS()?[...a.slice(1),a[0]]:a;};
const isWknd=(i)=>{const names=DOW_NAMES();return names[i]==='Sat'||names[i]==='Sun';};
let CAL_SEL=todayISO();                                /* mobile: selected day */
const MOBILE=()=>window.innerWidth<=760;
function weekDates(base){
  const d=new Date(base||CAL);const dow=dowIdx(d);d.setDate(d.getDate()-dow);
  return [...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return todayISO(x)});
}
function calTitle(){
  if(CALVIEW==='week'){
    const w=weekDates();
    const a=new Date(w[0]+'T12:00:00'),b=new Date(w[6]+'T12:00:00');
    const same=a.getMonth()===b.getMonth();
    return a.toLocaleDateString('en-CA',{month:'short',day:'numeric'})+' – '+b.toLocaleDateString('en-CA',{month:same?undefined:'short',day:'numeric'})+', '+b.getFullYear();
  }
  if(CALVIEW==='agenda')return 'Next 14 days';
  return CAL.toLocaleDateString('en-CA',{month:'long',year:'numeric'});
}

let _calMob=null;
window.addEventListener('resize',()=>{const m=MOBILE();if(_calMob!==null&&m!==_calMob&&VIEW==='calendar')RENDER.calendar();_calMob=m;});
RENDER.calendar=()=>{
  _calMob=MOBILE();
  const t=todayISO();
  $('#v-calendar').innerHTML=`
  <div id="cal-head">
    <div id="cal-title">${calTitle()}</div>
    <button class="btn sm" id="cal-prev">${I('left')}</button>
    <button class="btn sm" id="cal-today">Today</button>
    <button class="btn sm" id="cal-next">${I('right')}</button>
    <div class="seg tiny">
      <button class="${CALVIEW==='month'?'on':''}" data-v="month">Month</button>
      <button class="${CALVIEW==='week'?'on':''}" data-v="week">${MOBILE()?'Day':'Week'}</button>
      <button class="${CALVIEW==='agenda'?'on':''}" data-v="agenda">Agenda</button>
    </div>
    <span id="cal-count">${fmtCountdown()}</span>
    <div style="flex:1"></div>
    <button class="btn ghost sm cal-ws" onclick="toggleWeekStart()" title="Week starts on">${S.weekStart==='mon'?'Mon–Sun':'Sun–Sat'}</button>
    <button class="btn primary sm" onclick="addEventModal(MOBILE()?CAL_SEL:undefined)">${I('plus')}<span class="hide-m">New event</span></button>
  </div>
  <div id="cal-body">${MOBILE()?(CALVIEW==='month'?calMonthM(t):CALVIEW==='week'?calDayM(t):calAgenda(t)):(CALVIEW==='month'?calMonth(t):CALVIEW==='week'?calWeek(t):calAgenda(t))}</div>`;

  const step=CALVIEW==='week'?(MOBILE()?1:7):CALVIEW==='agenda'?14:0;
  $('#cal-prev').onclick=()=>{
    if(CALVIEW==='month')CAL=new Date(CAL.getFullYear(),CAL.getMonth()-1,1);
    else CAL.setDate(CAL.getDate()-step);
    RENDER.calendar();
  };
  $('#cal-next').onclick=()=>{
    if(CALVIEW==='month')CAL=new Date(CAL.getFullYear(),CAL.getMonth()+1,1);
    else CAL.setDate(CAL.getDate()+step);
    RENDER.calendar();
  };
  $('#cal-today').onclick=()=>{CAL=new Date();RENDER.calendar();};
  $$('#cal-head .seg button').forEach(b=>b.onclick=()=>{CALVIEW=b.dataset.v;CAL=new Date();RENDER.calendar();});

  if(MOBILE()){
    /* tap day -> select; swipe grid/strip -> prev/next */
    $$('.mcal-day').forEach(c=>c.addEventListener('click',()=>{CAL_SEL=c.dataset.date;CAL=new Date(CAL_SEL+'T12:00:00');RENDER.calendar();}));
    $$('.mstrip-day').forEach(c=>c.addEventListener('click',()=>{CAL_SEL=c.dataset.date;CAL=new Date(CAL_SEL+'T12:00:00');RENDER.calendar();}));
    const swipeEl=$('#mcal-grid')||$('#mday-strip');
    if(swipeEl)bindSwipe(swipeEl,dir=>{
      if(CALVIEW==='month')CAL=new Date(CAL.getFullYear(),CAL.getMonth()+dir,1);
      else{CAL.setDate(CAL.getDate()+dir);CAL_SEL=todayISO(CAL);}
      RENDER.calendar();
    });
    const col=$('#mday-col');
    if(col){
      col.addEventListener('click',e=>{
        if(e.target.closest('.wk-ev'))return;
        const rect=col.getBoundingClientRect();
        const hr=Math.max(DAY_START,Math.min(23,Math.floor((e.clientY-rect.top)/HOUR_H)+DAY_START));
        addEventModal(CAL_SEL,null,String(hr).padStart(2,'0')+':00');
      });
      positionNowM();
      if(!window._nowIntM)window._nowIntM=setInterval(()=>{if($('#mnowline'))positionNowM();},60000);
      /* scroll timeline near now / first event */
      const wrap=$('#mday-scroll');
      if(wrap){const now=new Date();const y=Math.max(0,((now.getHours()-DAY_START)*HOUR_H)-120);wrap.scrollTop=CAL_SEL===t?y:0;}
    }
    return;
  }
  if(CALVIEW==='month'){
    $$('#cal-grid .cal-cell').forEach(c=>c.addEventListener('click',()=>addEventModal(c.dataset.date)));
  }
  if(CALVIEW==='week'){
    $$('.wk-col').forEach(col=>col.addEventListener('click',e=>{
      if(e.target.closest('.wk-ev'))return;
      const rect=col.getBoundingClientRect();
      const hr=Math.max(DAY_START,Math.min(23,Math.floor((e.clientY-rect.top)/HOUR_H)+DAY_START));
      addEventModal(col.dataset.date,null,String(hr).padStart(2,'0')+':00');
    }));
    positionNow();
    if(!window._nowInt)window._nowInt=setInterval(()=>{if($('#nowline'))positionNow();},60000);
  }
};

function calMonth(t){
  const y=CAL.getFullYear(),m=CAL.getMonth();
  const startDow=dowIdx(new Date(y,m,1));
  const daysIn=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=0;i<42;i++){
    const dayNum=i-startDow+1;
    let d,dim=false;
    if(dayNum<1){d=new Date(y,m-1,prevDays+dayNum);dim=true;}
    else if(dayNum>daysIn){d=new Date(y,m+1,dayNum-daysIn);dim=true;}
    else d=new Date(y,m,dayNum);
    cells.push({iso:todayISO(d),n:d.getDate(),dim,wknd:isWknd(i%7)});
  }
  const evByDay={};
  S.events.forEach(e=>{(evByDay[e.date]=evByDay[e.date]||[]).push(e)});
  const upcoming=S.events.filter(e=>e.date>=t)
    .sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,9);

  return `
  <div class="grid cal-layout">
    <div>
      <div id="cal-grid">
        ${DOW_NAMES().map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(c=>{
          const evs=(evByDay[c.iso]||[]).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
          const mk=lifeMarks(c.iso);
          return `<div class="cal-cell ${c.dim?'dim':''} ${c.wknd?'wknd':''} ${c.iso===t?'today':''}" data-date="${c.iso}">
            <span class="d">${c.n}</span>
            ${evs.slice(0,3).map(e=>`<span class="cal-ev ${e.cat}" ${AC(e.cat)} onclick="event.stopPropagation();editEvent('${e.id}')" title="${esc(e.title)}">${e.time?`<span class="num">${esc(e.time)}</span> `:''}${esc(e.title)}</span>`).join('')}
            ${evs.length>3?`<span class="cal-more">+${evs.length-3} more</span>`:''}
            ${(mk.f||mk.g)?`<span class="mk">${mk.f?'<i class="f"></i>':''}${mk.g?'<i class="g"></i>':''}</span>`:''}
          </div>`;
        }).join('')}
      </div>
      <div class="sub" style="font-size:11px;color:var(--faint);margin-top:8px">Dots on a day = life logged there — red for training, green for golf. Click an event to edit it, a day to add.</div>
    </div>
    <div class="card">
      <div class="card-head"><div class="eyebrow">${I('clock')}Next up</div></div>
      <div class="rowlist">
        ${upcoming.length?upcoming.map(e=>`
          <div class="row">
            <div class="grow" style="cursor:pointer" onclick="editEvent('${e.id}')">
              <div class="title">${esc(e.title)}</div>
              <div class="sub">${fmtDateLong(e.date)}${e.time?' · '+e.time:''}</div>
            </div>
            <span class="tag ${e.cat}" ${AC(e.cat)}><span class="dot"></span>${CATN[e.cat]}</span>
          </div>`).join(''):'<div class="empty">Nothing on the board.</div>'}
      </div>
    </div>
  </div>`;
}

function calWeek(t){
  const w=weekDates();
  const hours=[...Array(DAY_END-DAY_START)].map((_,i)=>DAY_START+i);
  return `
  <div id="wk-scroll"><div id="wk-inner">
    <div id="wk-head">
      <div class="wk-h"></div>
      ${w.map(iso=>{
        const d=new Date(iso+'T12:00:00');
        return `<div class="wk-h ${iso===t?'today':''}">
          <div class="dw">${d.toLocaleDateString('en-CA',{weekday:'short'})}</div>
          <div class="dn">${d.getDate()}</div>
        </div>`;
      }).join('')}
    </div>
    <div id="wk-body">
      <div class="wk-time">${hours.map(h=>`<span style="top:${(h-DAY_START)*HOUR_H}px">${String(h).padStart(2,'0')}:00</span>`).join('')}</div>
      ${w.map(iso=>{
        const evs=S.events.filter(e=>e.date===iso);
        return `<div class="wk-col ${iso===t?'today':''}" data-date="${iso}">
          ${evs.filter(e=>e.allDay).map((e,i)=>`<div class="wk-ev allday ${e.cat}" ${AC(e.cat)} style="top:${2+i*20}px;height:17px" onclick="editEvent('${e.id}')">${esc(e.title)}</div>`).join('')}
          ${evs.filter(e=>!e.allDay).map(e=>{
            const [hh,mm]=(e.time||'09:00').split(':').map(Number);
            const top=Math.max(0,((hh*60+mm)-DAY_START*60)/60*HOUR_H);
            const hgt=Math.max(24,(e.durMin||60)/60*HOUR_H-3);
            return `<div class="wk-ev ${e.cat}" ${AC(e.cat)} style="top:${top.toFixed(1)}px;height:${hgt.toFixed(1)}px" onclick="editEvent('${e.id}')" title="${esc(e.title)}">
              <span class="tm">${esc(e.time||'')}</span>${esc(e.title)}
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
      <div id="nowline" style="display:none"></div>
    </div>
  </div></div>
  <div class="sub" style="font-size:11px;color:var(--faint);margin-top:8px">Click any empty slot to drop an event there. The red line is now.</div>`;
}
function positionNow(){
  const nl=$('#nowline');if(!nl)return;
  const t=todayISO(),w=weekDates();
  const idx=w.indexOf(t);
  const now=new Date();
  const mins=now.getHours()*60+now.getMinutes();
  if(idx<0||mins<DAY_START*60||mins>=DAY_END*60){nl.style.display='none';return;}
  const body=$('#wk-body');if(!body)return;
  const colW=(body.getBoundingClientRect().width-56)/7;
  nl.style.display='block';
  nl.style.top=((mins-DAY_START*60)/60*HOUR_H).toFixed(1)+'px';
  nl.style.left=(56+idx*colW).toFixed(1)+'px';
  nl.style.width=colW.toFixed(1)+'px';
}

/* ---------------- iOS-style mobile calendar ---------------- */
window.toggleWeekStart=()=>{S.weekStart=S.weekStart==='mon'?'sun':'mon';save();RENDER.calendar();};
function bindSwipe(el,cb){
  let x0=null,y0=null;
  el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0===null)return;
    const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    x0=y0=null;
    if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.4)cb(dx<0?1:-1);
  },{passive:true});
}
function dayItems(iso){
  const items=[];
  S.events.filter(e=>e.date===iso).sort((a,b)=>(b.allDay?1:0)-(a.allDay?1:0)||(a.time||'').localeCompare(b.time||'')).forEach(e=>{
    items.push({kind:'ev',id:e.id,cat:e.cat,time:e.allDay?'':(e.time||''),title:e.title,sub:CATN[e.cat]+(e.allDay?' · all-day':' · '+((e.durMin||60)>=60?((e.durMin||60)/60)+'h':(e.durMin||60)+'m'))});
  });
  const pu=S.pushups.log[iso];
  if(pu)items.push({kind:'life',cat:'fitness',time:'',title:S.fit.exercise+' — '+pu+' '+(S.sport.metric.unit||''),sub:disc().name});
  S.workouts.filter(x=>x.date===iso).forEach(x=>items.push({kind:'life',cat:'fitness',time:'',title:x.type+' — '+x.mins+'m',sub:'Training'}));
  S.golfSessions.filter(x=>x.date===iso).forEach(x=>items.push({kind:'life',cat:'golf',time:'',title:'Range — '+x.balls+' balls',sub:x.focus||'Practice'}));
  S.golf.rounds.filter(x=>x.date===iso).forEach(x=>items.push({kind:'life',cat:'golf',time:'',title:'Round — '+x.score,sub:x.course}));
  return items;
}
function dayListHTML(iso,t){
  const d=new Date(iso+'T12:00:00');

      <div class="dl">${iso===t?'Today':d.toLocaleDateString('en-CA',{weekday:'long'})}</div>

  return head+`<div class="mday-list">${items.map(i=>`
    <div class="mday-item ${i.cat}" ${AC(i.cat)} ${i.kind==='ev'?`onclick="editEvent('${i.id}')"`:''}>
      <div class="tm num">${i.time?esc(i.time):'<span class="alld">all-day</span>'}</div>
      <div class="bar"></div>
      <div class="bd"><div class="tt">${esc(i.title)}</div><div class="ss">${esc(i.sub)}</div></div>
    </div>`).join('')}</div>`;
}
function calMonthM(t){
  const y=CAL.getFullYear(),m=CAL.getMonth();
  const startDow=dowIdx(new Date(y,m,1));
  const daysIn=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const rows=Math.ceil((startDow+daysIn)/7);
  const cells=[];
  for(let i=0;i<rows*7;i++){
    const n=i-startDow+1;let d,dim=false;
    if(n<1){d=new Date(y,m-1,prevDays+n);dim=true;}
    else if(n>daysIn){d=new Date(y,m+1,n-daysIn);dim=true;}
    else d=new Date(y,m,n);
    cells.push({iso:todayISO(d),n:d.getDate(),dim,wknd:isWknd(i%7)});
  }
  const evByDay={};S.events.forEach(e=>{(evByDay[e.date]=evByDay[e.date]||[]).push(e)});
  return `
  <div id="mcal-grid">
    <div class="mcal-dow">${DOW_NAMES().map(d=>`<span>${d[0]}</span>`).join('')}</div>
    <div class="mcal-days">
      ${cells.map(c=>{
        const evs=(evByDay[c.iso]||[]).slice().sort((a,b)=>(b.allDay?1:0)-(a.allDay?1:0));const mk=lifeMarks(c.iso);
        const dots=[...evs.slice(0,3).map(e=>e.cat)];
        if(mk.f&&dots.length<4)dots.push('life-f');if(mk.g&&dots.length<4)dots.push('life-g');
        return `<div class="mcal-day ${c.dim?'dim':''} ${c.wknd?'wknd':''} ${c.iso===t?'today':''} ${c.iso===CAL_SEL?'sel':''}" data-date="${c.iso}">
          <span class="n">${c.n}</span>
          <span class="dots">${dots.map(k=>`<i class="${k}" ${k.startsWith('life-')?'':AC(k)}></i>`).join('')}</span>
        </div>`;
      }).join('')}
    </div>
  </div>
  <div id="mday-panel">${dayListHTML(CAL_SEL,t)}</div>`;
}
function calDayM(t){
  const w=weekDates(new Date(CAL_SEL+'T12:00:00'));
  const hours=[...Array(DAY_END-DAY_START)].map((_,i)=>DAY_START+i);
  const evs=S.events.filter(e=>e.date===CAL_SEL);
  const d=new Date(CAL_SEL+'T12:00:00');
  return `
  <div id="mday-strip">
    ${w.map(iso=>{
      const x=new Date(iso+'T12:00:00');const has=S.events.some(e=>e.date===iso);
      return `<div class="mstrip-day ${iso===t?'today':''} ${iso===CAL_SEL?'sel':''}" data-date="${iso}">
        <span class="dw">${x.toLocaleDateString('en-CA',{weekday:'narrow'})}</span>
        <span class="dn">${x.getDate()}</span>
        <i class="${has?'has':''}"></i>
      </div>`;

function rampPlan(){
  /* 8-week ramp from ~60/day back to 200/day */
  const T=S.pushups.target||100;
  const q=T>=200?10:T>=50?5:T>=10?1:0.5;                       /* step granularity scales with the target */
  const steps=[.2,.3,.4,.5,.6,.7,.85,1].map(f=>Math.max(q,Math.round(T*f/q)*q)).map(v=>+v.toFixed(1));
  const avg3=(()=>{const d=pushDays(3);return Math.round(d.reduce((a,x)=>a+x.v,0)/3)})();
  let cur=steps.findIndex(s=>avg3<s); if(cur<0)cur=steps.length-1;
  return {steps,cur,avg3};
}

}

function coachPush(r,t){

function coachContext(){
  const ramp=rampPlan();

  const d=disc();const sk=S.sport.skills.map(s=>s.k+' '+s.v+'/10').join(', ');
  return `Athlete: ${S.profile.name}. Discipline: ${d.name}${S.sport.teamSport?' ('+S.sport.teamSport+')':''}. Goal: ${S.fitGoal.focus}. Daily metric: ${S.fit.exercise} (${S.sport.metric.unit}), target ${S.pushups.target}/day. Self-rated skills: ${sk}. Session types: ${d.sessions.join(', ')}. `+

  `Live numbers: today ${pushToday()} ${S.fit.exercise}, 7-day total ${push7()}, best day ${bestPushDay()}, 3-day avg ${ramp.avg3}/day (ramp week ${ramp.cur+1}, target ${ramp.steps[ramp.cur]}/day). Workouts logged this week: ${w7}.${cw?` Current weight ${cw}${S.weight.goal?', goal '+S.weight.goal:''}.`:''}`;

async function coachLLM(prompt){
  /* 1) deployed: worker-side Claude (ANTHROPIC_API_KEY set on the worker) */
  try{
    const r=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt,context:coachContext()})});
    if(r.ok){const j=await r.json();if(j.text)return j.text;}
  }catch(e){}
  /* 2) inside claude.ai: direct call, no key needed */
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:
      `You are the user's personal strength coach inside their dashboard. Terse, sharp, honest — a corner-man, not a cheerleader. No emoji, no markdown headers, short lines. Context: ${coachContext()}\n\nThey say: ${prompt}`}]})
  });
  const data=await res.json();
  const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
  if(!txt)throw new Error('empty');
  return txt;
}
let COACH_LAST='';
function coachPick(arr){
  const i=(S.coachLog.length+arr.length)%arr.length;
  let out=arr[i];
  if(out===COACH_LAST&&arr.length>1)out=arr[(i+1)%arr.length];
  COACH_LAST=out;
  return out;
}
function coachLocal(prompt){
  const p=(prompt||'').toLowerCase();
  const ramp=rampPlan();
  const tgt=ramp.steps[ramp.cur];
  const setSize=Math.max(5,Math.round(tgt/8));
  const pt=pushToday();
  const w7=weekWorkouts().length;
  const EX=S.fit.exercise;
  if(p.includes('plan')||p.includes('week')||p==='__plan'){
    const prog=disc().program;const unit=S.sport.metric.unit;
    const subst=s=>s.replace('TGT',String(tgt)).replace('HALF',String(Math.round(tgt/2))).replace('SET',String(setSize)).replace(/REPS/g,EX);
    const weak=[...S.sport.skills].sort((a,b)=>a.v-b.v)[0];
    return `${disc().name} — week ${ramp.cur+1} of the ramp (${tgt} ${unit}/day). The job is showing up:\n`+
      prog.map((d,i)=>`D${i+1}  ${d.name} — ${d.ex.map(([n,x])=>subst(n)+(x&&x!=='—'?' '+subst(x):'')).join(' · ')}`).join('\n')+
      `\n\n${weak?`Weakest on your wheel: ${weak.k} (${weak.v}/10) — steal 10 minutes for it twice this week.`:''} Streak first, numbers second.`;
  }
  if(p.includes('cant')||p.includes("can't")||p.includes('hard')||p.includes('struggl')||p.includes('stuck')){
    return coachPick([
`Shrink the set until you can't say no. ${setSize} too many? Do 5. Regress the movement if you need to — it still counts in week ${ramp.cur+1}. The streak grades attendance, not difficulty.`,
`Lower the bar, not the standard. Easier variation, full range, ${Math.max(3,Math.round(setSize/2))} reps. Real sets are built out of sets exactly this small.`,
`Attach it to something you already do. Kettle's on — set. Waiting on a download — set. You don't find sets, you park them in the day.`]);
  }
  if(p.includes('motivat')||p.includes('lazy')||p.includes('dont want')||p.includes("don't want")||p.includes('tired')){
    return coachPick([
`Motivation's not coming — schedule is the replacement. ${setSize} ${EX.toLowerCase()} next time you stand up. Not a discussion, a calendar entry.`,
`You hit deadlines for other people. Same system: the body's just another client. Today's invoice is ${tgt}.`,
`Drift takes streaks, not decisions. Decide once: sets of ${setSize}, every hour. Drift's a bad opponent against a timer.`]);
  }
  if(p.includes('weight')||p.includes('eat')||p.includes('diet')||p.includes('protein')||p.includes('scale')){
    const cw=curWeight();
    return `${cw?`Scale: ${cw}. `:''}${S.weight.goal?`Goal: ${S.weight.goal}. `:''}Protein every meal, sleep, and let the streak lead — the scale is a lagging stat.`;
  }
  if(p.includes('sore')||p.includes('hurt')||p.includes('pain')||p.includes('elbow')||p.includes('shoulder')||p.includes('wrist')||p.includes('knee')){
    return `Soreness is scheduled, not a surprise. Sore muscle: train through at 50%. Sharp or joint-side pain: skip the movement, keep the walk, and tell me where so we route around it.`;
  }
  if(p.includes('set')&&(p.includes('how')||p.includes('many')||p.includes('size'))){
    return `Week-${ramp.cur+1} math: ${tgt}/day ÷ sets of ${setSize} = ${Math.ceil(tgt/setSize)} sets. One an hour clears it before dinner. Leave 2 in the tank every time.`;
  }
  if(p.length<=6){
    return coachPick([
`Yeah. ${pt>0?`${pt} on the board — ${Math.max(0,tgt-pt)} to close it.`:`Board's still zero. One set of ${setSize} changes that in 40 seconds.`}`,
`Talk's free, sets aren't. Done one since we started typing?`,
`Noted. Timer says next set of ${setSize} is now.`]);
  }
  if(pt>=tgt) return `${pt} today against a week-${ramp.cur+1} target of ${tgt}. Ahead — good. Don't raid tomorrow's volume; stacking easy days is the whole program.`;
  if(pt===0&&w7===0) return coachPick([
`Board says zero today, zero this week. Drop for ${setSize} right now — not ${S.pushups.target}, just the first set.`,
`Still zero. New deal: ${setSize} before your next message to me. I'll wait.`,
`Week ${ramp.cur+1} asks for ${tgt} spread over the day — ${Math.ceil(tgt/setSize)} tiny sets. Set one starts it; the rest is repetition.`]);
  if(pt===0) return `Nothing logged yet. Target ${tgt} — ${Math.ceil(tgt/setSize)} small sets between blocks. It isn't a montage, it's this boring rep.`;
  return `${pt} down, ${tgt-pt} left. Sets of ${setSize}, one every hour. Keep the engine running.`;
}
async function coachAsk(){

/* ============================================================
   PORTFOLIO — live quotes: Kraken (crypto, keyless) + Finnhub (stocks)
   ============================================================ */
const KRAKEN_MAP={BTC:'XBTUSD',ETH:'ETHUSD',SOL:'SOLUSD',XRP:'XRPUSD',ADA:'ADAUSD',DOGE:'DOGEUSD',LTC:'LTCUSD',DOT:'DOTUSD',LINK:'LINKUSD',AVAX:'AVAXUSD'};
async function quoteCrypto(sym){
  const pair=KRAKEN_MAP[sym]||sym+'USD';
  const res=await fetch('https://api.kraken.com/0/public/Ticker?pair='+pair);
  const data=await res.json();
  const k=Object.keys(data.result||{})[0];
  if(!k)throw new Error('no pair');
  const t=data.result[k];
  const p=+t.c[0], open=+t.o;
  return {p,dp:open?((p-open)/open*100):0};
}
async function quoteStock(sym){
  if(!VAULT.finnhubKey)throw new Error('no key');
  const res=await fetch('https://finnhub.io/api/v1/quote?symbol='+encodeURIComponent(sym)+'&token='+encodeURIComponent(VAULT.finnhubKey));
  const d=await res.json();
  if(!d||!d.c)throw new Error('no quote');
  return {p:d.c,dp:d.dp||0};
}
/* ---- portfolio vault v2: holdings + Finnhub key encrypted at rest (AES-GCM / PBKDF2), salted, in-memory when open ----
   Migration: legacy plaintext holdings + legacy unsalted hash -> on first correct unlock, encrypt + wipe plaintext. */
let PORT_OPEN=false, PORT_KEY=null;
const VAULT={holdings:[],finnhubKey:''};           /* in-memory decrypted payload */
const QUOTES={};                                   /* in-memory only — symbols never persist */
async function sha256hex(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function vaultKey(pass,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function vaultPersist(){
  if(!PORT_OPEN||!PORT_KEY)return;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},PORT_KEY,new TextEncoder().encode(JSON.stringify(VAULT)));
  S.vault.enc={iv:b64e(iv),ct:b64e(ct)};
  save();
}
async function vaultOpenWith(pass){
  /* new-style */
  if(S.vault&&S.vault.hash){
    const salt=b64d(S.vault.salt);
    const h=await sha256hex(pass+':'+S.vault.salt);
    if(h!==S.vault.hash)return false;
    PORT_KEY=await vaultKey(pass,salt);
    if(S.vault.enc){
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(S.vault.enc.iv)},PORT_KEY,b64d(S.vault.enc.ct));
      Object.assign(VAULT,JSON.parse(new TextDecoder().decode(pt)));
    }
    PORT_OPEN=true;return true;
  }
  /* first use: the key you type becomes the vault key */
  if(pass.length<6){toast('Vault key: 6+ characters');return false;}
  const saltB=crypto.getRandomValues(new Uint8Array(16));const salt=b64e(saltB);
  S.vault={salt,hash:await sha256hex(pass+':'+salt),enc:null};
  PORT_KEY=await vaultKey(pass,saltB);
  VAULT.holdings=(S.portfolio&&S.portfolio.holdings)||[];
  VAULT.finnhubKey=(S.portfolio&&S.portfolio.finnhubKey)||'';
  /* wipe plaintext from state forever */
  S.portfolio={quotes:{},updated:0,seeded:true,holdings:[],finnhubKey:''};
  PORT_OPEN=true;
  await vaultPersist();
  toast('Vault created — positions encrypt at rest with this key');
  return true;
}
window.portUnlock=async()=>{
  const inp=$('#port-pass');if(!inp)return;
  const ok=await vaultOpenWith(inp.value).catch(()=>false);
  if(ok){toast('Vault open');RENDER.money();buildTicker();refreshQuotes(true);}
  else{inp.value='';toast('Denied');}
};
window.portLock=()=>{PORT_OPEN=false;PORT_KEY=null;VAULT.holdings=[];VAULT.finnhubKey='';for(const k in QUOTES)delete QUOTES[k];RENDER.money();buildTicker();toast('Vault sealed');};
window.portChangeKey=async()=>{
  if(!PORT_OPEN)return;
  const p=await keyPrompt('New vault key','Re-encrypts your positions with a new key. Relocks with the new key next time.',true);
  if(!p)return;
  const saltB=crypto.getRandomValues(new Uint8Array(16));const salt=b64e(saltB);
  S.vault={salt,hash:await sha256hex(p+':'+salt),enc:null};
  PORT_KEY=await vaultKey(p,saltB);
  await vaultPersist();toast('Vault key changed');
};
let PORT_BUSY=false;
let QUOTES_AT=0;
async function refreshQuotes(force){
  if(!PORT_OPEN||PORT_BUSY)return;
  if(!force&&Date.now()-QUOTES_AT<60000)return;
  if(!VAULT.holdings.length)return;
  PORT_BUSY=true;
  const btn=$('#port-refresh');if(btn)btn.textContent='Refreshing…';
  let hits=0;
  for(const h of VAULT.holdings){
    try{
      const q=h.type==='crypto'?await quoteCrypto(h.sym):await quoteStock(h.sym);
      QUOTES[h.sym]={p:q.p,dp:q.dp,t:Date.now()};hits++;
    }catch(e){/* keep last known */}
  }
  QUOTES_AT=Date.now();PORT_BUSY=false;
  if(VIEW==='money')RENDER.money();
  buildTicker();
  if(hits===0)toast('No quotes — check connection / Finnhub key');
}
function portRows(){
  return VAULT.holdings.map(h=>{
    const q=QUOTES[h.sym];
    const price=q?q.p:null;
    const mv=price!==null?price*h.qty:h.cost*h.qty;
    const pl=price!==null?(price-h.cost)*h.qty:0;
    const plPct=h.cost&&price!==null?((price-h.cost)/h.cost*100):0;
    return {...h,price,mv,pl,plPct,dp:q?q.dp:null,live:!!q};
  });
}
function portTotals(){
  const rows=portRows();
  const mv=rows.reduce((a,r)=>a+r.mv,0);
  const costTot=rows.reduce((a,r)=>a+r.cost*r.qty,0);
  return {mv,pl:mv-costTot,plPct:costTot?((mv-costTot)/costTot*100):0,rows};
}

const SUB_CYCLES={monthly:{label:'Monthly',months:1},yearly:{label:'Yearly',months:12},weekly:{label:'Weekly',months:0.25},quarterly:{label:'Quarterly',months:3}};
function subMonthly(s){return s.cycle==='weekly'?s.price*52/12:s.price/SUB_CYCLES[s.cycle].months;}
function subAnnual(s){return subMonthly(s)*12;}
function subNext(s){
  /* next renewal on/after today from anchor date */
  if(!s.next)return null;
  let d=new Date(s.next+'T12:00:00');const t=new Date();t.setHours(12,0,0,0);
  const c=SUB_CYCLES[s.cycle];let guard=0;
  while(d<t&&guard++<600){if(s.cycle==='weekly')d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+Math.round(c.months));}
  return todayISO(d);
}
function subDaysTo(s){const n=subNext(s);if(!n)return null;return Math.round((new Date(n+'T12:00:00')-new Date(todayISO()+'T12:00:00'))/86400000);}
function subsActive(){return S.subs.filter(s=>s.status!=='cancelled');}
function subsMonthlyTotal(){return subsActive().reduce((a,s)=>a+subMonthly(s),0);}

/* ============================================================
   NOTES — iOS Notes-grade: search, pin, folders, per-note lock (AES-GCM), mobile stack nav
   ============================================================ */
let NOTE=S.notes[0]?S.notes[0].id:null;
let NOTE_Q='', NOTE_FOLDER='all', NOTE_MEDIT=false;
const NOTE_KEYS={};                       /* id -> CryptoKey, in-memory only, relocks on reload */
const b64e=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function noteKey(pass,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encText(text,key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text||''));
  return {iv:b64e(iv),ct:b64e(ct)};
}
async function noteDecrypt(n,key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(n.enc.iv)},key,b64d(n.enc.ct));
  return new TextDecoder().decode(pt);
}
function noteOpenBody(n){ return n.locked?(n._plain!==undefined?n._plain:null):n.body; }
function notePreview(n){
  if(n.locked&&n._plain===undefined)return 'Locked note';
  const b=(n.locked?n._plain:n.body)||'';
  return b.replace(/\n+/g,' ').trim().slice(0,90)||'No additional text';
}
function noteWhen(ts){
  const d=new Date(ts),t=new Date();
  const same=d.toDateString()===t.toDateString();
  return same?d.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});
}
function noteList(){
  const q=NOTE_Q.toLowerCase();
  return S.notes.filter(n=>{
    if(NOTE_FOLDER==='pinned'&&!n.pinned)return false;
    if(NOTE_FOLDER==='locked'&&!n.locked)return false;
    if(!q)return true;
    const body=n.locked?(n._plain||''):(n.body||'');
    return (n.title||'').toLowerCase().includes(q)||body.toLowerCase().includes(q);
  }).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.ts||0)-(a.ts||0));
}

    });
    $('#note-title').addEventListener('input',sync);
    $('#note-body').addEventListener('input',()=>{sync();wc();});
    wc();
  }
};

/* ---- lock flow: one notes key, set on first lock; hash stored + synced, key never stored ---- */
function keyPrompt(title,sub,confirmPass){
  return new Promise(res=>{
    modal(`
      <h3><span class="tick">#</span> ${title}</h3>
      <div class="sub" style="font-size:12px;color:var(--muted);margin-bottom:12px">${sub}</div>

      ${confirmPass?`<div class="field"><label>Confirm</label><input id="m-k2" type="password" autocomplete="off"></div>`:''}
      <div class="modal-actions">
        <button class="btn" id="m-cancel">Cancel</button>
        <button class="btn primary" id="m-ok">${confirmPass?'Set key & lock':'Unlock'}</button>
      </div>`,
      ()=>{
        const go=()=>{
          const k=$('#m-k1').value;
          if(!k)return;
          if(confirmPass&&$('#m-k2').value!==k){toast("Keys don't match");return;}
          closeModal();res(k);
        };
        $('#m-ok').onclick=go;
        $('#m-cancel').onclick=()=>{closeModal();res(null);};
        $$('#modal input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go();}));
      });
  });
}
window.noteLockPrompt=async id=>{
  const n=S.notes.find(x=>x.id===id);if(!n)return;
  const first=!S.notesLock;
  const pass=await keyPrompt(first?'Create notes key':'Lock note',
    first?'One key for every locked note. It never leaves this device unhashed — locked notes are AES-encrypted before they sync. Lose the key, lose the notes.':'Enter your notes key to encrypt this note.',first);
  if(!pass)return;
  const salt=first?crypto.getRandomValues(new Uint8Array(16)):b64d(S.notesLock.salt);
  const h=await sha256hex(pass+':'+b64e(salt));
  if(!first&&h!==S.notesLock.hash){toast('Wrong notes key');return;}
  if(first)S.notesLock={salt:b64e(salt),hash:h};
  const key=await noteKey(pass,salt);
  const text=$('#note-body')?$('#note-body').value:(n.body||'');
  n.enc=await encText(text,key);
  n.body='';n.locked=true;n._plain=text;NOTE_KEYS[id]=key;
  save();toast('Note locked');RENDER.notes();
};
window.noteUnlockPrompt=async id=>{
  const n=S.notes.find(x=>x.id===id);if(!n||!S.notesLock)return;
  const pass=await keyPrompt('Unlock note','Enter your notes key. Stays open until you relock or reload.',false);
  if(!pass)return;
  const salt=b64d(S.notesLock.salt);
  const h=await sha256hex(pass+':'+b64e(salt));
  if(h!==S.notesLock.hash){toast('Wrong notes key');return;}
  const key=await noteKey(pass,salt);
  try{n._plain=await noteDecrypt(n,key);NOTE_KEYS[id]=key;toast('Unlocked');}
  catch(e){toast('Could not decrypt');return;}
  RENDER.notes();
};
window.noteRelock=id=>{const n=S.notes.find(x=>x.id===id);delete n._plain;delete NOTE_KEYS[id];toast('Locked');RENDER.notes();};

async function loadDoorLog(){
  const el=$('#door-log');if(!el)return;
  if(!SYNC.on){el.innerHTML='<div class="empty">Door log lives behind the Worker.</div>';return;}
  try{
    const r=await fetch('/api/doorlog');const log=r.ok?await r.json():[];
    if(!log.length){el.innerHTML='<div class="empty">No intrusion attempts. Quiet on the perimeter.</div>';return;}
    el.innerHTML=log.slice(0,12).map(x=>`<div class="row">
      <span class="time num">${new Date(x.t).toLocaleString('en-CA',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
      <div class="grow"><div class="title num" style="color:var(--neg)">${esc(x.ip||'?')}${x.city||x.country?` · ${esc([x.city,x.country].filter(Boolean).join(', '))}`:''}</div>
      <div class="sub">${esc((x.ua||'').replace(/Mozilla\/5\.0 \(|\).*$/g,'').slice(0,80))}</div></div>
    </div>`).join('');
  }catch(e){el.innerHTML='<div class="empty">Could not load door log.</div>';}
}
window.doorClear=async()=>{try{await fetch('/api/doorlog',{method:'DELETE'});}catch(e){}loadDoorLog();};

async function loadSnaps(){
  const el=$('#snap-list');if(!el)return;
  if(!SYNC.on){el.innerHTML='<div class="empty">Cloud sync is offline on this device — snapshots live behind the Worker.</div>';return;}
  const names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const rows=[];
  for(let d=0;d<7;d++){
    try{
      const r=await fetch('/api/backup?day='+d);
      if(!r.ok)continue;
      const j=await r.json();
      if(j&&j.t)rows.push({d,t:j.t});
    }catch(e){}
  }
  if(!rows.length){el.innerHTML='<div class="empty">No snapshots yet — one gets taken automatically before each day\'s first save.</div>';return;}
  rows.sort((a,b)=>b.t-a.t);
  el.innerHTML=rows.map(r=>`
    <div class="row">
      <div class="grow">
        <div class="title">${names[r.d]}</div>
        <div class="sub num">${new Date(r.t).toLocaleString('en-CA')}</div>
      </div>
      <button class="btn sm" onclick="snapRestore(${r.d})">${I('reset')}Restore</button>
    </div>`).join('');
}
window.snapRestore=async d=>{
  if(!confirm('Replace current data with this snapshot? Current state will be overwritten everywhere.'))return;
  try{
    const r=await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({day:d})});
    if(r.ok){toast('Restored — reloading');setTimeout(()=>location.reload(),700);}
    else toast('Restore failed');
  }catch(e){toast('Restore failed');}
};

/* ============================================================
   KEYS — encrypted password vault (PBKDF2 → AES-256-GCM), own key, in-memory when open, auto-locks
   ============================================================ */
let KEYS_OPEN=false, KEYS_KEY=null, KEYS_TIMER=null, KEYS_Q='', KEYS_REVEAL={};
const KV=[];  /* decrypted items: {id,title,user,pass,url,note,ts} */
async function keysDerive(pass,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function keysPersist(){
  if(!KEYS_OPEN||!KEYS_KEY)return;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEYS_KEY,new TextEncoder().encode(JSON.stringify(KV)));
  S.keys.enc={iv:b64e(iv),ct:b64e(ct)};S.keys.updated=Date.now();save();
}
function keysTouch(){clearTimeout(KEYS_TIMER);if(KEYS_OPEN)KEYS_TIMER=setTimeout(()=>{keysLock();toast('Keys auto-locked');},5*60*1000);}
window.keysLock=()=>{KEYS_OPEN=false;KEYS_KEY=null;KV.length=0;KEYS_REVEAL={};clearTimeout(KEYS_TIMER);if(VIEW==='keys')RENDER.keys();};
window.keysUnlock=async()=>{
  const inp=$('#keys-pass');if(!inp)return;const pass=inp.value;
  try{
    if(S.keys.hash){
      const h=await sha256hex(pass+':'+S.keys.salt);
      if(h!==S.keys.hash){inp.value='';toast('Denied');return;}
      KEYS_KEY=await keysDerive(pass,b64d(S.keys.salt));
      if(S.keys.enc){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(S.keys.enc.iv)},KEYS_KEY,b64d(S.keys.enc.ct));KV.length=0;KV.push(...JSON.parse(new TextDecoder().decode(pt)));}
    }else{
      if(pass.length<8){toast('Keys master key: 8+ characters');return;}
      const c=$('#keys-pass2');if(!c||c.value!==pass){toast("Keys don't match");return;}
      const saltB=crypto.getRandomValues(new Uint8Array(16));const salt=b64e(saltB);
      S.keys.salt=salt;S.keys.hash=await sha256hex(pass+':'+salt);
      KEYS_KEY=await keysDerive(pass,saltB);KV.length=0;
      KEYS_OPEN=true;await keysPersist();
      toast('Keys vault created');RENDER.keys();return;
    }
    KEYS_OPEN=true;keysTouch();toast('Keys open — auto-locks in 5 min');RENDER.keys();
  }catch(e){toast('Could not open vault');}
};
window.keysAdd=(editId)=>{
  const it=editId?KV.find(x=>x.id===editId):null;
  modal(`
    <h3><span class="tick">#</span> ${it?'Edit key':'New key'}</h3>
    <div class="field"><label>Title</label><input id="m-kt" value="${it?esc(it.title):''}" placeholder="Cloudflare / Kraken / Router"></div>
    <div class="field-row">
      <div class="field"><label>Username / email</label><input id="m-ku" value="${it?esc(it.user):''}" autocomplete="off"></div>
      <div class="field"><label>URL</label><input id="m-kl" value="${it?esc(it.url||''):''}" placeholder="https://"></div>
    </div>
    <div class="field"><label>Password</label>
      <div style="display:flex;gap:6px"><input id="m-kp" value="${it?esc(it.pass):''}" autocomplete="off" style="font-family:var(--font-mono)"><button class="btn sm" type="button" onclick="keysGen()" title="Generate">${I('dice')}</button></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="m-kn" placeholder="Recovery codes, hints…">${it?esc(it.note||''):''}</textarea></div>
    <div class="modal-actions">
      ${it?`<button class="btn danger" id="m-del">${I('trash')}Delete</button><div style="flex:1"></div>`:''}
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="m-save">${it?'Save':'Add key'}</button>
    </div>`,
    ()=>{
      $('#m-save').onclick=async()=>{
        const title=$('#m-kt').value.trim();if(!title)return;
        const data={title,user:$('#m-ku').value.trim(),url:$('#m-kl').value.trim(),pass:$('#m-kp').value,note:$('#m-kn').value.trim(),ts:Date.now()};
        if(it)Object.assign(it,data);else KV.unshift({id:uid(),...data});
        await keysPersist();closeModal();toast(it?'Key updated':'Key added');RENDER.keys();
      };
      if(it)$('#m-del').onclick=async()=>{const i=KV.findIndex(x=>x.id===editId);if(i>-1)KV.splice(i,1);await keysPersist();closeModal();toast('Key deleted');RENDER.keys();};
    });
};
window.keysGen=()=>{
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?-_';
  const a=crypto.getRandomValues(new Uint32Array(20));
  const p=[...a].map(n=>chars[n%chars.length]).join('');
  const el=$('#m-kp');if(el){el.value=p;el.focus();}
};
window.keysCopy=async(id,field)=>{
  const it=KV.find(x=>x.id===id);if(!it)return;
  try{await navigator.clipboard.writeText(it[field]||'');toast((field==='pass'?'Password':'Username')+' copied — clears in 30s');
    setTimeout(async()=>{try{const cur=await navigator.clipboard.readText();if(cur===it[field])await navigator.clipboard.writeText('');}catch(e){}},30000);}
  catch(e){toast('Clipboard blocked');}
  keysTouch();
};
window.keysReveal=id=>{KEYS_REVEAL[id]=!KEYS_REVEAL[id];keysTouch();RENDER.keys();};
window.keysChangeMaster=async()=>{
  if(!KEYS_OPEN)return;
  const p=await keyPrompt('New master key','Re-encrypts every key with a new master key.',true);
  if(!p||p.length<8){if(p)toast('8+ characters');return;}
  const saltB=crypto.getRandomValues(new Uint8Array(16));const salt=b64e(saltB);
  S.keys.salt=salt;S.keys.hash=await sha256hex(p+':'+salt);KEYS_KEY=await keysDerive(p,saltB);
  await keysPersist();toast('Master key changed');
};
function keysStrength(p){
  if(!p)return 0;let s=0;if(p.length>=8)s++;if(p.length>=14)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return Math.min(4,Math.round(s*0.8));
}
RENDER.keys=()=>{
  const q=KEYS_Q.toLowerCase();
  const list=KV.filter(k=>!q||(k.title+' '+k.user+' '+(k.url||'')).toLowerCase().includes(q)).sort((a,b)=>a.title.localeCompare(b.title));
  $('#v-keys').innerHTML=`
  ${!KEYS_OPEN?`
  <div class="card keys-gate">
    <div class="keys-gate-in">
      <div class="keys-badge">${I('key')}</div>
      <h3>${S.keys.hash?'Keys — sealed':'Keys — set your master key'}</h3>
      <p>${S.keys.hash?'Everything here is AES-256 encrypted at rest. Enter your master key to open. Auto-locks after 5 minutes idle, on reload, and on lock.'
        :'A private password vault. Pick a master key that is not your door passphrase or vault key. It never leaves this device unhashed — lose it, lose the vault.'}</p>
      <input id="keys-pass" type="password" placeholder="${S.keys.hash?'master key':'create master key (8+)'}" autocomplete="off" onkeydown="if(event.key==='Enter')keysUnlock()">
      ${S.keys.hash?'':`<input id="keys-pass2" type="password" placeholder="confirm" autocomplete="off" onkeydown="if(event.key==='Enter')keysUnlock()">`}
      <button class="btn primary" onclick="keysUnlock()">${I('lock')}${S.keys.hash?'Unlock':'Create vault'}</button>
    </div>
  </div>`:`
  <div class="keys-top">
    <div class="note-search" style="flex:1;max-width:360px"><input id="keys-q" placeholder="Search keys" value="${esc(KEYS_Q)}" autocomplete="off"></div>
    <div style="flex:1"></div>
    <span class="sub num" style="font-size:11px;color:var(--faint)">${KV.length} keys · auto-lock 5m</span>
    <button class="btn ghost sm" onclick="keysChangeMaster()" title="Change master key">${I('edit')}Master</button>
    <button class="btn ghost sm" onclick="keysLock()">${I('lock')}Lock</button>
    <button class="btn primary sm" onclick="keysAdd()">${I('plus')}<span class="hide-m">New key</span></button>
  </div>
  <div class="keys-list">
    ${list.length?list.map(k=>{
      const dom=(k.url||'').replace(/^https?:\/\//,'').replace(/\/.*$/,'');
      const st=keysStrength(k.pass);
      return `<div class="key-row">
        <div class="key-av" style="--kc:hsl(${[...k.title].reduce((a,c)=>a+c.charCodeAt(0),0)%360} 45% 45%)">${esc(k.title.slice(0,1).toUpperCase())}</div>
        <div class="key-main" onclick="keysAdd('${k.id}')">
          <div class="key-t">${esc(k.title)}${dom?`<span class="key-dom">${esc(dom)}</span>`:''}</div>
          <div class="key-u">${esc(k.user||'—')}</div>
          <div class="key-p ${KEYS_REVEAL[k.id]?'show':''}">${KEYS_REVEAL[k.id]?esc(k.pass):'••••••••••••'}<i class="st s${st}" title="strength"></i></div>
        </div>
        <div class="key-act">
          <button class="iconbtn" onclick="keysCopy('${k.id}','user')" title="Copy username">${I('user')}</button>
          <button class="iconbtn" onclick="keysCopy('${k.id}','pass')" title="Copy password">${I('copy')}</button>
          <button class="iconbtn" onclick="keysReveal('${k.id}')" title="${KEYS_REVEAL[k.id]?'Hide':'Reveal'}">${I(KEYS_REVEAL[k.id]?'eyeoff':'eye')}</button>
          ${k.url?`<a class="iconbtn" href="${esc(k.url.startsWith('http')?k.url:'https://'+k.url)}" target="_blank" rel="noopener" title="Open site">${I('right')}</a>`:''}
        </div>
      </div>`;}).join(''):`<div class="empty" style="padding:50px 20px">${KEYS_Q?'No matches.':'Empty vault. Add your first key.'}</div>`}
  </div>`}`;
  const kq=$('#keys-q');if(kq)kq.addEventListener('input',e=>{KEYS_Q=e.target.value;const p=e.target.selectionStart;RENDER.keys();const n=$('#keys-q');if(n){n.focus();n.setSelectionRange(p,p);}});
  if(KEYS_OPEN){['click','keydown','touchstart'].forEach(ev=>$('#v-keys').addEventListener(ev,keysTouch,{passive:true,once:true}));}
  const kp=$('#keys-pass');if(kp)setTimeout(()=>kp.focus(),50);
};
/* relock keys when leaving the view or hiding the tab */
document.addEventListener('visibilitychange',()=>{if(document.hidden&&KEYS_OPEN)keysLock();});


window.sportPicker=()=>{
  let pick=S.sport.id,team=S.sport.teamSport||'soccer';
  const paint=()=>{
    const d=DISCIPLINES[pick];
    $('#sp-grid').innerHTML=Object.entries(DISCIPLINES).map(([id,x])=>`<div class="opt ${pick===id?'on':''}" data-id="${id}">${I('fitness')}<div><div class="t">${x.name}</div><div class="s">${x.sub}</div></div></div>`).join('');
    $$('#sp-grid .opt').forEach(o=>o.onclick=()=>{pick=o.dataset.id;paint();});
    $('#sp-team').style.display=pick==='team'?'block':'none';
    $('#sp-ml').value=d.metric.label;$('#sp-mu').value=d.metric.unit;$('#sp-mt').value=d.metric.target;
    $('#sp-mq').value=d.metric.quick.join(', ');
    $('#sp-team-sel').value=team;
  };
  modal(`
    <h3><span class="tick">#</span> Training discipline</h3>
    <div class="sub" style="font-size:12px;color:var(--muted);margin-bottom:12px">Pick what you train. Fitness reshapes around it — daily metric, session types, skill wheel, weekly program, coach.</div>
    <div id="sp-grid" class="opts" style="margin-bottom:12px"></div>
    <div id="sp-team" class="field" style="display:none"><label>Which sport?</label><select id="sp-team-sel">${TEAM_SPORTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>
    <div class="field-row">
      <div class="field"><label>Daily metric</label><input id="sp-ml" placeholder="Pushups / Kilometres"></div>
      <div class="field"><label>Unit</label><input id="sp-mu" placeholder="reps / km / min"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Daily target</label><input id="sp-mt" type="number" min="1"></div>
      <div class="field"><label>Quick-add buttons</label><input id="sp-mq" placeholder="10, 20, 25, 50"></div>
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="sp-save">Apply</button></div>`,
    ()=>{
      paint();
      $('#sp-team-sel').addEventListener('change',e=>{team=e.target.value;});
      $('#sp-save').onclick=()=>{
        const quick=$('#sp-mq').value.split(/[,\s]+/).map(Number).filter(n=>n>0).slice(0,5);
        const metric={label:$('#sp-ml').value.trim()||DISCIPLINES[pick].metric.label,unit:$('#sp-mu').value.trim()||DISCIPLINES[pick].metric.unit,target:Math.max(1,+$('#sp-mt').value||DISCIPLINES[pick].metric.target),quick:quick.length?quick:DISCIPLINES[pick].metric.quick};
        const changed=pick!==S.sport.id||team!==S.sport.teamSport;
        sportApply(pick,pick==='team'?team:'',metric);
        if(changed)S.sport.skills=discSkillsDefaultFor(pick,pick==='team'?team:'').map(k=>({k,v:5}));
        save();closeModal();toast(DISCIPLINES[pick].name+' — locked in');
        RENDER[VIEW]&&RENDER[VIEW]();buildTicker();
      };
    });
};

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
const PAL_CMDS=[
  {label:'Go — Profile',icon:'user',hint:'nav',run:()=>go('profile')},
  ...VIEWS.map(v=>({label:'Go — '+v.label,icon:v.icon,hint:'nav',run:()=>go(v.id)})),
  {label:'Go — Settings',icon:'dot',hint:'nav',run:()=>go('settings')},
  {label:'Pushups +25',icon:'fitness',hint:'log',run:()=>pushAdd(25)},
  {label:'Pushups +50',icon:'fitness',hint:'log',run:()=>pushAdd(50)},
  {label:'Log weight',icon:'scale',hint:'log',run:addWeightModal},
  {label:'Add task',icon:'tasks',hint:'new',run:addTaskModal},
  {label:'Add event',icon:'calendar',hint:'new',run:()=>addEventModal()},
  {label:'Add project',icon:'work',hint:'new',run:()=>addProjectModal((S.areas.find(a=>a.kind==='work')||S.areas[0]).id)},
  {label:'Log workout',icon:'fitness',hint:'log',run:addWorkoutModal},
  {label:'Log range session',icon:'golf',hint:'log',run:addGolfModal},
  {label:'Log round',icon:'golf',hint:'log',run:addRoundModal},
  {label:'Add transaction',icon:'money',hint:'log',run:addTxModal},
  {label:'Open Keys vault',icon:'key',hint:'go',run:()=>go('keys')},
  {label:'Add subscription',icon:'reset',hint:'new',run:()=>{go('money');addSubModal();}},
  {label:'Add portfolio holding',icon:'money',hint:'new',run:()=>{PORT_OPEN?addHoldingModal():(go('money'),toast('Vault sealed — second key first'))}},
  {label:'Refresh portfolio quotes',icon:'reset',hint:'live',run:()=>{PORT_OPEN?refreshQuotes(true):(go('money'),toast('Vault sealed — second key first'))}},
  {label:'Add habit',icon:'habits',hint:'new',run:addHabitModal},
  {label:'Upload avatar',icon:'camera',hint:'profile',run:()=>document.getElementById('avatar-file').click()},
  {label:'Start / pause focus block',icon:'clock',hint:'timer',run:focusToggle},
  ...THEMES.map(t=>({label:'Theme — '+t.name,icon:'dot',hint:'theme',run:()=>setTheme(t.id)}))
];
let palSel=0,palMatches=[];
function palOpen(){$('#palette').classList.add('open');$('#pal-input').value='';palFilter('');$('#pal-input').focus();}
function palClose(){$('#palette').classList.remove('open');}
function palFilter(q){q=q.toLowerCase();palMatches=PAL_CMDS.filter(c=>c.label.toLowerCase().includes(q));palSel=0;palPaint();}
function palPaint(){
  $('#pal-list').innerHTML=palMatches.map((c,i)=>`
    <div class="pal-item ${i===palSel?'sel':''}" data-i="${i}">${I(c.icon)}${c.label}<span class="hint">${c.hint}</span></div>
  `).join('')||'<div class="empty" style="margin:8px">No match.</div>';
  $$('.pal-item').forEach(el=>el.onclick=()=>{palClose();palMatches[+el.dataset.i].run();});
}
$('#pal-input').addEventListener('input',e=>palFilter(e.target.value));
$('#pal-input').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palMatches.length-1);palPaint();}
  if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);palPaint();}
  if(e.key==='Enter'&&palMatches[palSel]){palClose();palMatches[palSel].run();}
});
$('#palette').addEventListener('click',e=>{if(e.target.id==='palette')palClose();});
$('#tb-cmd').addEventListener('click',palOpen);
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOpen();}
});

   INIT
   ============================================================ */
buildNav();
paintAvatar();
applyAccent();
bgfxInit();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
setTheme(THEMES.some(t=>t.id===S.theme)?S.theme:'broadcast');
{const bo=$('#boot-op');if(bo)bo.textContent=(S.profile.name||'READY').toUpperCase();}
focusPaint();
tickClock();
go('overview');
buildTicker();
if(DEMO){const db=document.getElementById('demo-bar');if(db){db.style.display='flex';document.documentElement.classList.add('demo');const rp=document.getElementById('db-repo');if(rp&&window.HQ_REPO_URL)rp.href=window.HQ_REPO_URL;}}
pullState().finally(()=>{BOOTED=true;if(!S.setup)obPaint();});
setInterval(()=>{if(SYNC.on&&!document.hidden)pullState();},120000);
setInterval(buildTicker,60000);

/* number-key navigation (1-9 views, 0 settings) */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(['input','textarea','select'].includes(tag))return;
  if($('#palette').classList.contains('open')||$('#modal-root').classList.contains('open'))return;
  if(e.key>='1'&&e.key<='9'){const vs=VIEWS.filter(v=>v.id==='overview'||S.modules[v.id]!==false);const v=vs[+e.key-1];if(v)go(v.id);}
  if(e.key==='0')go('settings');
  if(e.key.toLowerCase()==='p')go('profile');
});

/* boot sequence */
(function(){
  const b=document.getElementById('boot');if(!b)return;
  let reduced=false;try{reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  const delay=reduced?60:1150;
  setTimeout(()=>b.classList.add('off'),delay);
  setTimeout(()=>b.remove(),delay+600);
})();
</script>
